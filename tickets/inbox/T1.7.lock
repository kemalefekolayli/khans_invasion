T1.7 - Quest Panel Polish: smaller squares, left scrollbar, visible connector lines
==================================================================================
Priority: high
Branch: feature/t1.7-quest-panel-polish

User feedback (three issues on the quest tree panel):
1. "making the quest square smaller" - QuestItem nodes are too big.
2. "adding a scroll bar to the left we cant scroll rn" - the vertical
   scrollbar is anchored on the RIGHT; user wants it on the LEFT, and
   scrolling reportedly does not work.
3. "i'd really like if there was a line between the quests" - connector
   lines are not visible between quest nodes.

Scope (minimum diff, no bloat):
A. Shrink quest nodes:
   - QuestPanelController defaults: nodeWidth 200->130, nodeHeight 140->90,
     columnSpacing 210->140, rowSpacing 200->110, treePadding 20->12.
   - Update serialized values on the QuestPanelController component in
     QuestPanelCanvas.prefab (the block with nodeWidth: 200 etc.).
   - QuestItem template: m_SizeDelta 200x140 -> 130x90 in the prefab.
     Title RectTransform 188x48, Progress 188x30, Arrow 24x24 -> scale down
     to fit the smaller node (Title ~122x40, Progress ~122x24, Arrow ~18x18).
     Font sizes 14/13 can stay (maybe reduce to 12/11).
B. Move vertical scrollbar to the LEFT:
   - In prefab, scrollbar RectTransform (fileID 4800000000000002008) is
     anchored RIGHT (AnchorMin {1,0}, AnchorMax {1,1}, AnchoredPosition
     {-8,0}, Pivot {1,0.5}). Change to LEFT: AnchorMin {0,0}, AnchorMax
     {0,1}, AnchoredPosition {8,0}, Pivot {0,0.5}.
   - Ensure ScrollRect still wires m_VerticalScrollbar to it.
C. Visible line between quests:
   - Connector lines ARE generated by QuestPanelController.CreateConnectors
     -> AddConnectorRect (runtime Image children of treeContent), so the
     code path exists. Verify they actually render:
     * Image with no sprite assigned renders nothing! AddConnectorRect adds
       an Image but never assigns image.sprite. Assign the built-in
       "UISprite"/white sprite (Resources.GetBuiltinResource<Sprite>
       "UISprite") or use the UI default sprite so the rect is visible.
     * Colors: lockedConnectorColor 0.3 alpha 1 is very dark - bump to a
       lighter gray so lines are visible even for locked quests, or keep.
     * Verify RecolorConnectors runs and sets colors.
   - ALSO: quest item boxes have sprite images (questBoxImage) - those render
     fine; only connector Image lacked a sprite.
D. Optional sanity: confirm scrolling works - ScrollRect is wired with
   Content, Viewport(RectMask2D), vertical scrollbar. Content sizeDelta is
   set in BuildTree so scroll range should be computed. If the content fits
   the viewport nothing scrolls; smaller nodes reduce content size but with
   16 quests and a multi-level tree it should still overflow.

Verification: user will check Unity editor/play mode. Keep diff focused.
Report in tickets/outbox/T1.7.md.
