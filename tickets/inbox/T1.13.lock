T1.13 - Static irregular map border tile layer
===============================================

User-approved direction:
- Use the approved 12 preview sprites.
- Place square tiles underneath province objects so province boundaries and
  ownership visuals remain on top.
- Do not create a rectangular border around the map.
- Keep the layer static and subtle.
- Movement boundary is a separate future task.

Implementation goal:
- Create a dedicated MapBorderDecor layer under province renderers and above
  the generic map/background layer.
- Place tiles only in external edge regions outside the occupied province
  silhouette; do not cover the entire rectangular map bounds.
- Use the approved visual zones: coast left/lower-left, coast-to-arid south/
  southwest, cold/barren upper arc, rocky/steppe east and southeast.
- Preserve irregular silhouette, bays, tips, wedges, and large transparent
  corners where appropriate.
- Use existing sea/coast visual language where possible and the approved
  Arid/ColdBarren/RockySteppe preview sprites for land edge decoration.
- Keep decoration purely visual: no colliders, no province creation, no
  movement/pathing changes, no runtime polling or particles.

Allowed scope:
- Map prefab/asset hierarchy and dedicated decorative assets under the map
  system or Assets/Art/MapBorder.
- Static tile/patched decoration implementation only.

Forbidden:
- Assets/Scenes/StartScene.unity
- movement/pathing scripts
- province data/geometry/ownership logic
- Packages, ProjectSettings, MCP configuration

Use Unity MCP for map hierarchy/prefab inspection where available. Do not
save or modify StartScene. If exact external-mask placement is too costly,
stop and report a fallback proposal rather than creating a rectangular fill.
Write implementation notes to tickets/outbox/T1.13.md. Do not merge/push.
